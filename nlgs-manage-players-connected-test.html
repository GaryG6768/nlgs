<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NLGS Manage Players</title>
<style>
body{margin:0;background:#e9ece5;font-family:system-ui;color:#193127}
.app{max-width:480px;margin:auto;min-height:100vh;background:#f6f3e8}
.top{background:#064b35;color:white;padding:16px 18px}
.brand{font:22px Georgia}.sub{font-size:9px;letter-spacing:1.5px}
.main{padding:18px 16px}
.hero{background:linear-gradient(160deg,#064b35,#0b7452);color:white;border-radius:20px;padding:22px 18px}
.hero h1{font:29px Georgia;margin:5px 0}
.card,.player{background:white;border-radius:15px;padding:15px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:12px;color:#6b756f}
.search{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8ddd5;border-radius:9px;font-size:16px;margin-top:10px}
.hcp{font-size:21px;font-weight:800;color:#064b35}
.notice{background:#edf4ef;padding:11px;border-radius:10px;font-size:12px}
.error{background:#fff0f0;color:#8b1e1e;padding:11px;border-radius:10px;margin-top:10px}
.player{border:1px solid #e1e5df}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">NLGS</div><div class="sub">NORWICH LOCO GOLF SOCIETY</div></header>
<main class="main">
<div class="hero"><div class="small" style="color:white">CONNECTED TEST VERSION</div><h1>Manage Players & Handicaps</h1><div>Reading your real NLGS members.</div></div>
<div class="notice">Read-only test. This version does not change your database.</div>
<div id="status" class="card">Loading members…</div>
<div class="card">
<div class="row"><div><b>Players</b><div class="small" id="count"></div></div></div>
<input id="search" class="search" placeholder="Search players..." oninput="render()">
<div id="list"></div>
</div>
</main>
</div>

<script>
const SUPABASE_URL='https://ifjsjksskaknuqjboxsl.supabase.co';
const SUPABASE_KEY='sb_publishable_sM00u7HKZ06m9XFFG2pBug_ypzkbnZp';
let players=[];

async function load(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/members?select=id,full_name,handicap,role&order=full_name.asc',{
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
    });
    if(!r.ok) throw new Error('Supabase returned '+r.status);
    players=await r.json();
    document.getElementById('status').textContent='Connected successfully — read-only test.';
    render();
  }catch(e){
    document.getElementById('status').innerHTML='<div class="error"><b>Could not load members.</b><br>'+e.message+'</div>';
  }
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const a=players.filter(x=>(x.full_name||'').toLowerCase().includes(q));
  document.getElementById('count').textContent=a.length+' member'+(a.length===1?'':'s')+' shown';
  document.getElementById('list').innerHTML=a.map(x=>
    '<div class="player"><div class="row"><div><b>'+esc(x.full_name)+'</b><div class="small">'+esc(x.role||'Member')+'</div></div><div><div class="small">Handicap</div><div class="hcp">'+(x.handicap==null?'—':Number(x.handicap).toFixed(1))+'</div></div></div></div>'
  ).join('') || '<div class="small" style="padding:15px 0">No members found.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
load();
</script>
</body>
</html>
