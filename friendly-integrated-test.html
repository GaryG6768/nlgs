<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NLGS Friendly Game Test</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

#appFrame{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

#loading{
  position:fixed;
  inset:0;
  background:#064b35;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  z-index:9999;
}

#loading div{
  font-size:16px;
}

#loading b{
  display:block;
  font-size:30px;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div id="loading">
  <div>
    <b>NLGS</b>
    Loading Friendly Game test…
  </div>
</div>

<iframe
  id="appFrame"
  src="./index.html?friendly-test=1"
  title="NLGS Friendly Game Test">
</iframe>

<script>

const frame = document.getElementById('appFrame');
const loading = document.getElementById('loading');

frame.addEventListener('load', function(){

  try{

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    /*
      Wait for the existing NLGS application
      to finish loading.
    */

    setTimeout(function(){

      const script = doc.createElement('script');

      script.textContent = `

(function(){

  console.log(
    'NLGS FRIENDLY MULTI-SCORER TEST ACTIVE'
  );

  const originalRenderFriendlyScore =
    window.renderFriendlyScore;

  let multiStatus = null;
  let multiFinalising = false;


  function credentials(){

    return window.nlgsLoginCredentials || {};

  }


  function round(){

    return typeof getFriendlyRound === 'function'
      ? getFriendlyRound()
      : null;

  }


  /*
    --------------------------------------------------
    SCORE AGREEMENT PANEL
    --------------------------------------------------
  */

  function ensureAgreementPanel(){

    const section =
      document.getElementById('friendlyScore');

    if(!section) return;

    if(
      document.getElementById(
        'friendlyAgreementCard'
      )
    ){
      return;
    }

    const saveButton =
      document.getElementById(
        'friendlySaveAllBtn'
      );

    if(!saveButton) return;


    const card =
      document.createElement('div');

    card.className='card';

    card.id='friendlyAgreementCard';


    card.innerHTML =
      '<div class="row">'+
        '<h3 style="margin:0">'+
          'SCORE AGREEMENT'+
        '</h3>'+
        '<span class="pill" '+
          'id="friendlyAgreementPill">'+
          'Checking…'+
        '</span>'+
      '</div>'+
      '<div id="friendlyAgreementBody" '+
        'class="small" '+
        'style="margin-top:8px">'+
      '</div>'+
      '<button '+
        'id="friendlyFinaliseBtn" '+
        'class="btn" '+
        'style="display:none;margin-top:12px" '+
        'onclick="nlgsFinaliseFriendlyRound()">'+
        'FINALISE ROUND'+
      '</button>';


    const parent =
      saveButton.parentNode.parentNode;


    parent.insertBefore(
      card,
      parent.children[1] || null
    );

  }


  /*
    Get submissions for a player and hole.
  */

  function submissionsFor(
    playerIndex,
    hole
  ){

    return (
      multiStatus &&
      Array.isArray(
        multiStatus.submissions
      )
        ? multiStatus.submissions
        : []
    ).filter(function(row){

      return Number(
        row.player_index ??
        row.competition_player_id
      ) === Number(playerIndex)

      &&
      
      Number(row.hole_no)
        === Number(hole);

    });

  }


  /*
    Check one hole.
  */

  function checkHole(
    game,
    hole
  ){

    const missing=[];
    const conflicts=[];


    game.players.forEach(
      function(player,index){

        const rows =
          submissionsFor(
            index,
            hole
          );


        if(!rows.length){

          missing.push(player);

          return;

        }


        const values =
          [
            ...new Set(
              rows.map(function(row){

                return Number(
                  row.strokes
                );

              })
            )
          ];


        if(values.length>1){

          conflicts.push({

            player:player,
            values:values

          });

        }

      }
    );


    return {

      missing:missing,

      conflicts:conflicts,

      agreed:
        missing.length===0 &&
        conflicts.length===0

    };

  }


  /*
    Display agreement information.
  */

  function renderAgreement(){

    ensureAgreementPanel();


    const game=round();

    if(
      !game ||
      !game.dbId
    ){

      return;

    }


    const pill =
      document.getElementById(
        'friendlyAgreementPill'
      );

    const body =
      document.getElementById(
        'friendlyAgreementBody'
      );

    const finalise =
      document.getElementById(
        'friendlyFinaliseBtn'
      );


    if(!pill || !body)
      return;


    let agreed=0;
    let missing=0;
    let conflicts=0;


    for(
      let hole=1;
      hole<=18;
      hole++
    ){

      const result =
        checkHole(
          game,
          hole
        );


      if(result.agreed)
        agreed++;


      missing +=
        result.missing.length;


      conflicts +=
        result.conflicts.length;

    }


    const current =
      checkHole(
        game,
        game.currentHole
      );


    if(
      current.conflicts.length
    ){

      pill.textContent =
        '⚠️ DISCREPANCY';


      body.innerHTML =
        '<b>Hole '+
        game.currentHole+
        ' has a score discrepancy.</b><br>'+
        current.conflicts.map(
          function(item){

            return (
              item.player+
              ': '+
              item.values.join(' / ')
            );

          }
        ).join('<br>')+
        '<br><br>'+
        'Both scores are retained until the scorers agree.';


    }else if(
      current.missing.length
    ){

      pill.textContent =
        'AWAITING SCORES';


      body.innerHTML =
        'Hole '+
        game.currentHole+
        ': waiting for '+
        current.missing.join(', ')+
        '.';


    }else{

      pill.textContent =
        '✓ AGREED';


      body.innerHTML =
        'Hole '+
        game.currentHole+
        ' is agreed.';

    }


    if(
      agreed===18 &&
      missing===0 &&
      conflicts===0
    ){

      body.innerHTML +=
        '<br><br>'+
        '<b>18 / 18 holes agreed ✓</b><br>'+
        'All agreed scores are ready for the final leaderboard.';


    }else{

      body.innerHTML +=
        '<br><br>'+
        '<b>'+
        agreed+
        ' / 18 holes agreed</b><br>'+
        missing+
        ' missing player/hole score(s) • '+
        conflicts+
        ' disputed hole(s).';

    }


    if(finalise){

      finalise.style.display =
        agreed===18 &&
        missing===0 &&
        conflicts===0 &&
        Number(game.currentHole)>=18
          ? 'block'
          : 'none';

    }

  }


  /*
    Read submissions from Supabase.
  */

  async function refreshStatus(){

    const game=round();
    const login=credentials();


    if(
      !game ||
      !game.dbId ||
      !login.name ||
      !login.pin
    ){

      return null;

    }


    const result =
      await sb.rpc(
        'get_friendly_submission_status',
        {

          p_friendly_game_id:
            game.dbId,

          p_member_name:
            login.name,

          p_member_pin:
            login.pin

        }
      );


    if(result.error)
      throw result.error;


    if(
      result.data &&
      result.data.error
    ){

      throw new Error(
        result.data.error
      );

    }


    multiStatus =
      result.data;


    renderAgreement();


    return result.data;

  }


  /*
    Save the current hole using the
    new multi-scorer database function.
  */

  async function saveMultiScores(){

    const game=round();
    const login=credentials();


    if(
      !game ||
      !game.dbId ||
      !login.name ||
      !login.pin
    ){

      throw new Error(
        'Please log in before scoring.'
      );

    }


    const inputs =
      [
        ...document.querySelectorAll(
          '.friendly-hole-score'
        )
      ];


    if(!inputs.length){

      throw new Error(
        'Enter a score for every player.'
      );

    }


    const scores =
      inputs.map(
        function(input,index){

          return {

            player_index:index,

            strokes:Number(
              input.value
            )

          };

        }
      );


    if(
      scores.some(
        function(score){

          return (
            !Number.isInteger(
              score.strokes
            ) ||
            score.strokes<1 ||
            score.strokes>15
          );

        }
      )
    ){

      throw new Error(
        'Enter a valid score for every player.'
      );

    }


    const hole =
      Number(game.currentHole);


    const result =
      await sb.rpc(
        'save_friendly_hole_submission',
        {

          p_friendly_game_id:
            game.dbId,

          p_member_name:
            login.name,

          p_member_pin:
            login.pin,

          p_hole_no:
            hole,

          p_scores:
            scores

        }
      );


    if(result.error)
      throw result.error;


    if(
      result.data &&
      result.data.error
    ){

      throw new Error(
        result.data.error
      );

    }


    /*
      Keep the existing local scorecard
      updated as well.
    */

    game.players.forEach(
      function(player,index){

        if(!game.scores[player])
          game.scores[player]={};


        game.scores[player][hole] =
          scores[index].strokes;

      }
    );


    saveFriendlyState();


    /*
      MOVE TO NEXT HOLE IMMEDIATELY.
    */

    if(hole<18){

      game.currentHole =
        hole+1;


      saveFriendlyState();


      originalRenderFriendlyScore();


      /*
        Refresh agreement status without
        holding up the screen.
      */

      refreshStatus()
        .catch(function(error){

          console.warn(
            'Agreement refresh:',
            error
          );

        });


    }else{

      originalRenderFriendlyScore();

      await refreshStatus();

      renderAgreement();

    }


    return result.data;

  }


  /*
    Replace the existing save function.
  */

  window.saveFriendlyScore =
    async function(){

      const button =
        document.getElementById(
          'friendlySaveAllBtn'
        );


      if(button)
        button.disabled=true;


      try{

        await saveMultiScores();


        if(typeof toast==='function')
          toast('Scores saved');


      }catch(error){

        console.error(
          'Multi-scorer save failed:',
          error
        );


        if(typeof toast==='function'){

          toast(
            error.message ||
            'Could not save scores'
          );

        }


      }finally{

        if(button)
          button.disabled=false;


        if(
          typeof updateFriendlySaveButton===
          'function'
        ){

          updateFriendlySaveButton();

        }

      }

    };


  /*
    Finalise the round.
  */

  window.nlgsFinaliseFriendlyRound =
    async function(){

      if(multiFinalising)
        return;


      const game=round();


      if(
        !game ||
        !game.dbId
      ){

        return;

      }


      multiFinalising=true;


      const button =
        document.getElementById(
          'friendlyFinaliseBtn'
        );


      if(button){

        button.disabled=true;

        button.textContent=
          'CHECKING SCORES…';

      }


      try{

        await refreshStatus();


        let missing=0;
        let conflicts=0;


        for(
          let hole=1;
          hole<=18;
          hole++
        ){

          const result =
            checkHole(
              game,
              hole
            );


          missing +=
            result.missing.length;


          conflicts +=
            result.conflicts.length;

        }


        if(
          missing ||
          conflicts
        ){

          if(typeof toast==='function'){

            toast(
              'Round cannot be finalised. '+
              'Resolve missing scores and discrepancies first.'
            );

          }


          renderAgreement();

          return;

        }


        /*
          Build the final agreed scorecard.
        */

        for(
          let playerIndex=0;
          playerIndex<game.players.length;
          playerIndex++
        ){

          const player =
            game.players[playerIndex];


          game.scores[player]={};


          for(
            let hole=1;
            hole<=18;
            hole++
          ){

            const rows =
              submissionsFor(
                playerIndex,
                hole
              );


            const values =
              [
                ...new Set(
                  rows.map(function(row){

                    return Number(
                      row.strokes
                    );

                  })
                )
              ];


            if(values.length!==1){

              throw new Error(
                'A final agreed score could not be established.'
              );

            }


            game.scores[player][hole] =
              values[0];

          }

        }


        saveFriendlyState();


        /*
          Preserve the existing NLGS
          database save routine if present.
        */

        if(
          typeof saveFriendlyToDatabase===
          'function'
        ){

          try{

            await saveFriendlyToDatabase();

          }catch(error){

            console.warn(
              'Final database save:',
              error
            );

          }

        }


        /*
          Existing NLGS final scoring.
        */

        if(
          typeof finishFriendlyRound===
          'function'
        ){

          finishFriendlyRound();

        }


      }catch(error){

        console.error(
          'Finalisation failed:',
          error
        );


        if(typeof toast==='function'){

          toast(
            error.message ||
            'Could not finalise the round'
          );

        }

      }finally{

        multiFinalising=false;


        if(button){

          button.disabled=false;

          button.textContent=
            'FINALISE ROUND';

        }

      }

    };


  /*
    Add the agreement panel every time
    the Friendly scoring screen renders.
  */

  window.renderFriendlyScore =
    function(){

      originalRenderFriendlyScore();

      ensureAgreementPanel();

      renderAgreement();

    };


  /*
    Initial setup.
  */

  setTimeout(
    function(){

      try{

        ensureAgreementPanel();

        refreshStatus()
          .catch(function(){});

      }catch(error){

        console.warn(error);

      }

    },
    700
  );


})();
`;

      win.eval(script.textContent);

      loading.style.display='none';

    },1200);

  }catch(error){

    loading.innerHTML =
      '<div>'+
      '<b>NLGS</b>'+
      'The test could not start.<br><br>'+
      String(error.message || error)+
      '</div>';

    console.error(error);

  }

});

</script>

</body>
</html>
