<head>
<meta charset="utf-8">

html,body{

  width:100%;
  height:100%;

}

<body>

<div id="loading">
  <div>
    <b>NLGS</b>
    Loading Friendly Game test…
  </div>
</div>

<iframe

<script>

const frame=document.getElementById('appFrame');
const loading=document.getElementById('loading');

frame.addEventListener('load',function(){

  try{

    const win=frame.contentWindow;
    const doc=frame.contentDocument;

    setTimeout(function(){

      const script=doc.createElement('script');

      script.textContent=`

(function(){

console.log(
  'NLGS FRIENDLY MULTI-SCORER TEST ACTIVE'
);


/* =========================================================
   LOGIN
   ========================================================= */

function getCredentials(){

  if(
    window.nlgsLoginCredentials &&
    window.nlgsLoginCredentials.name &&
    window.nlgsLoginCredentials.pin
  ){

    return window.nlgsLoginCredentials;

  }

  try{

    const member=
      JSON.parse(
        sessionStorage.getItem('nlgsMember') || 'null'
      );

    const nameInput=
      document.getElementById('loginName');

    const pinInput=
      document.getElementById('loginPin');

    const name=
      member?.full_name ||
      nameInput?.value?.trim() ||
      '';

    const pin=
      pinInput?.value?.trim() ||
      '';

    if(name && pin){

      window.nlgsLoginCredentials={
        name:name,
        pin:pin
      };

      return window.nlgsLoginCredentials;

    }

  }catch(e){

    console.warn(
      'Login restore failed',
      e
    );

  }

  return {};

}


/*
 Capture login button.
*/

document.addEventListener(
  'click',
  function(e){

    if(
      e.target &&
      (
        e.target.id==='loginBtn' ||
        e.target.closest('#loginBtn')
      )
    ){

      setTimeout(function(){

        const name=
          document.getElementById(
            'loginName'
          )?.value?.trim() || '';

        const pin=
          document.getElementById(
            'loginPin'
          )?.value?.trim() || '';

        if(name && pin){

          window.nlgsLoginCredentials={
            name:name,
            pin:pin
          };

          console.log(
            'NLGS test login captured'
          );

        }

      },700);

    }

  },
  true
);


/* =========================================================
   ROUND / STATE
   ========================================================= */

function getRound(){

  return typeof getFriendlyRound==='function'
    ? getFriendlyRound()
    : null;

}

let multiStatus=null;
let finalising=false;


/* =========================================================
   FIND CURRENT MEMBER'S OWN SUBMISSION
   ========================================================= */

function mySubmission(
  playerIndex,
  hole
){

  if(
    !multiStatus ||
    !Array.isArray(
      multiStatus.submissions
    )
  ){

    return null;

  }

  const login=getCredentials();

  const scorerId=
    multiStatus.scorer_member_id ||
    multiStatus.scorer_id ||
    multiStatus.member_id ||
    null;

  const rows=
    multiStatus.submissions.filter(
      function(row){

        const playerOK=
          Number(
            row.player_index ??
            row.competition_player_id
          )===
          Number(playerIndex);

        const holeOK=
          Number(row.hole_no)===
          Number(hole);

        if(!playerOK || !holeOK)
          return false;

        /*
          Prefer the actual scorer/member ID.
        */

        if(scorerId){

          return String(
            row.scorer_member_id ||
            row.scorer_id ||
            ''
          )===
          String(scorerId);

        }

        /*
          Fallback to scorer name if supplied.
        */

        const rowName=
          row.scorer_name ||
          row.member_name ||
          row.full_name ||
          '';

        if(
          rowName &&
          login.name
        ){

          return(
            rowName.toLowerCase()===
            login.name.toLowerCase()
          );

        }

        return false;

      }
    );

  return rows.length
    ? rows[0]
    : null;

}


/* =========================================================
   ALL SUBMISSIONS FOR PLAYER / HOLE
   ========================================================= */

function allSubmissions(
  playerIndex,
  hole
){

  if(
    !multiStatus ||
    !Array.isArray(
      multiStatus.submissions
    )
  ){

    return [];

  }

  return multiStatus.submissions.filter(
    function(row){

      return(
        Number(
          row.player_index ??
          row.competition_player_id
        )===
        Number(playerIndex)
        &&
        Number(row.hole_no)===
        Number(hole)
      );

    }
  );

}


/* =========================================================
   EXPECTED SCORE
   ========================================================= */

function expectedScore(
  game,
  playerIndex,
  hole
){

  try{

    const hd=
      typeof friendlyHoleData==='function'
        ? friendlyHoleData(
            game,
            hole
          )
        : null;

    const pd=
      (game.playerData || [])
        [playerIndex] || {};

    if(!hd)
      return '';

    const shots=
      typeof friendlyShotsOnHole==='function'
        ? friendlyShotsOnHole(
            pd.playingHandicap,
            hd.stroke_index
          )
        : 0;

    return Math.max(
      1,
      Math.min(
        15,
        Number(hd.par || 0)+
        Number(shots || 0)
      )
    );

  }catch(e){

    return '';

  }

}


/* =========================================================
   MAKE THE DISPLAY BELONG TO THE CURRENT SCORER
   ========================================================= */

function syncScorerDisplay(){

  const game=getRound();

  if(
    !game ||
    !game.dbId
  ){

    return;

  }

  const hole=
    Number(game.currentHole || 1);

  const cards=[
    ...document.querySelectorAll(
      '#friendlyHolePlayers .card, #friendlyHolePlayers > div'
    )
  ];

  cards.forEach(function(card){

    const input=
      card.querySelector(
        '.friendly-hole-score'
      );

    if(!input)
      return;

    const playerIndex=
      Number(
        input.dataset.player
      );

    const own=
      mySubmission(
        playerIndex,
        hole
      );

    const status=
      card.querySelector(
        '.cs-score-status'
      );

    if(own){

      /*
        THIS MEMBER has submitted.
      */

      input.value=
        Number(own.strokes);

      if(status){

        status.textContent=
          'Saved';

      }

      card.classList.add(
        'saved'
      );

      const smalls=
        card.querySelectorAll(
          '.small'
        );

      if(smalls.length){

        const last=
          smalls[smalls.length-1];

        if(
          last &&
          last.textContent
            .toLowerCase()
            .includes('expected')
        ){

          last.textContent=
            'Saved score';

        }

      }

    }else{

      /*
        THIS MEMBER has NOT submitted.
        Ignore any score stored in the old
        shared scorecard.
      */

      const expected=
        expectedScore(
          game,
          playerIndex,
          hole
        );

      if(expected!==''){

        input.value=
          expected;

      }else{

        input.value='';

      }

      if(status){

        status.textContent=
          'Not entered';

      }

      card.classList.remove(
        'saved'
      );

      const smalls=
        card.querySelectorAll(
          '.small'
        );

      if(smalls.length){

        const last=
          smalls[smalls.length-1];

        if(last){

          last.textContent=
            'Expected handicap score';

        }

      }

    }

  });

}


/* =========================================================
   AGREEMENT PANEL
   ========================================================= */

function ensureAgreementPanel(){

  const section=
    document.getElementById(
      'friendlyScore'
    );

  if(!section)
    return;

  if(
    document.getElementById(
      'friendlyAgreementCard'
    )
  ){

    return;

  }

  const saveButton=
    document.getElementById(
      'friendlySaveAllBtn'
    );

  if(!saveButton)
    return;

  const card=
    document.createElement('div');

  card.className='card';

  card.id=
    'friendlyAgreementCard';

  card.innerHTML=
    '<div class="row">'+
      '<h3 style="margin:0">'+
        'SCORE AGREEMENT'+
      '</h3>'+
      '<span class="pill" '+
        'id="friendlyAgreementPill">'+
        'Checking…'+
      '</span>'+
    '</div>'+
    '<div id="friendlyAgreementBody" '+
      'class="small" '+
      'style="margin-top:8px">'+
    '</div>'+
    '<button '+
      'id="friendlyFinaliseBtn" '+
      'class="btn" '+
      'style="display:none;margin-top:12px" '+
      'onclick="nlgsFinaliseFriendlyRound()">'+
      'FINALISE ROUND'+
    '</button>';

  const parent=
    saveButton.parentNode.parentNode;

  parent.insertBefore(
    card,
    parent.children[1] || null
  );

}


/* =========================================================
   CHECK A HOLE
   ========================================================= */

function checkHole(
  game,
  hole
){

  const missing=[];
  const conflicts=[];

  game.players.forEach(
    function(player,index){

      const rows=
        allSubmissions(
          index,
          hole
        );

      if(!rows.length){

        missing.push(
          player
        );

        return;

      }

      const values=[
        ...new Set(
          rows.map(function(row){

            return Number(
              row.strokes
            );

          })
        )
      ];

      if(values.length>1){

        conflicts.push({

          player:player,

          values:values

        });

      }

    }
  );

  return{

    missing:missing,

    conflicts:conflicts,

    agreed:
      missing.length===0 &&
      conflicts.length===0

  };

}


/* =========================================================
   RENDER AGREEMENT
   ========================================================= */

function renderAgreement(){

  ensureAgreementPanel();

  const game=getRound();

  if(
    !game ||
    !game.dbId
  ){

    return;

  }

  const pill=
    document.getElementById(
      'friendlyAgreementPill'
    );

  const body=
    document.getElementById(
      'friendlyAgreementBody'
    );

  const finalise=
    document.getElementById(
      'friendlyFinaliseBtn'
    );

  if(!pill || !body)
    return;

  let agreed=0;
  let missing=0;
  let conflicts=0;

  for(
    let hole=1;
    hole<=18;
    hole++
  ){

    const result=
      checkHole(
        game,
        hole
      );

    if(result.agreed)
      agreed++;

    missing+=
      result.missing.length;

    conflicts+=
      result.conflicts.length;

  }

  const current=
    checkHole(
      game,
      game.currentHole
    );

  if(
    current.conflicts.length
  ){

    pill.textContent=
      '⚠️ DISCREPANCY';

    body.innerHTML=
      '<b>Hole '+
      game.currentHole+
      ' has a score discrepancy.</b><br>'+
      current.conflicts.map(
        function(item){

          return(
            item.player+
            ': '+
            item.values.join(' / ')
          );

        }
      ).join('<br>')+
      '<br><br>'+
      'Both scores are retained until the scorers agree.';

  }else if(
    current.missing.length
  ){

    pill.textContent=
      'AWAITING SCORES';

    body.innerHTML=
      'Hole '+
      game.currentHole+
      ': waiting for '+
      current.missing.join(', ')+
      '.';

  }else{

    pill.textContent=
      '✓ AGREED';

    body.innerHTML=
      'Hole '+
      game.currentHole+
      ' is agreed.';

  }

  if(
    agreed===18 &&
    missing===0 &&
    conflicts===0
  ){

    body.innerHTML+=
      '<br><br>'+
      '<b>18 / 18 holes agreed ✓</b><br>'+
      'All agreed scores are ready for the final leaderboard.';

  }else{

    body.innerHTML+=
      '<br><br>'+
      '<b>'+
      agreed+
      ' / 18 holes agreed</b><br>'+
      missing+
      ' missing player/hole score(s) • '+
      conflicts+
      ' disputed hole(s).';

  }

  if(finalise){

    finalise.style.display=
      agreed===18 &&
      missing===0 &&
      conflicts===0 &&
      Number(game.currentHole)>=18
        ?'block'
        :'none';

  }

}


/* =========================================================
   GET DATABASE STATUS
   ========================================================= */

async function refreshStatus(){

  const game=getRound();
  const login=getCredentials();

  if(
    !game ||
    !game.dbId ||
    !login.name ||
    !login.pin
  ){

    return null;

  }

  const result=
    await sb.rpc(
      'get_friendly_submission_status',
      {

        p_friendly_game_id:
          game.dbId,

        p_member_name:
          login.name,

        p_member_pin:
          login.pin

      }
    );

  if(result.error)
    throw result.error;

  if(
    result.data &&
    result.data.error
  ){

    throw new Error(
      result.data.error
    );

  }

  multiStatus=
    result.data;

  renderAgreement();

  syncScorerDisplay();

  return result.data;

}


/* =========================================================
   SAVE CURRENT HOLE
   ========================================================= */

async function saveMultiScores(){

  const game=getRound();
  const login=getCredentials();

  if(
    !game ||
    !game.dbId
  ){

    throw new Error(
      'Friendly game database record not found.'
    );

  }

  if(
    !login.name ||
    !login.pin
  ){

    throw new Error(
      'Please log in before scoring.'
    );

  }

  const inputs=[
    ...document.querySelectorAll(
      '.friendly-hole-score'
    )
  ];

  if(!inputs.length){

    throw new Error(
      'Enter a score for every player.'
    );

  }

  const scores=
    inputs.map(
      function(input,index){

        return{

          player_index:index,

          strokes:Number(
            input.value
          )

        };

      }
    );

  if(
    scores.some(
      function(score){

        return(
          !Number.isInteger(
            score.strokes
          ) ||
          score.strokes<1 ||
          score.strokes>15
        );

      }
    )
  ){

    throw new Error(
      'Enter a valid score for every player.'
    );

  }

  const hole=
    Number(game.currentHole);

  const result=
    await sb.rpc(
      'save_friendly_hole_submission',
      {

        p_friendly_game_id:
          game.dbId,

        p_member_name:
          login.name,

        p_member_pin:
          login.pin,

        p_hole_no:
          hole,

        p_scores:
          scores

      }
    );

  if(result.error)
    throw result.error;

  if(
    result.data &&
    result.data.error
  ){

    throw new Error(
      result.data.error
    );

  }


  /*
    Do NOT rely on the old shared scorecard
    for this member's Saved status.
  */

  if(
    typeof saveFriendlyState==='function'
  ){

    saveFriendlyState();

  }


  /*
    Get the fresh database submissions.
  */

  await refreshStatus();


  /*
    Automatically advance to next hole.
  */

  if(hole<18){

    game.currentHole=
      hole+1;

    if(
      typeof saveFriendlyState==='function'
    ){

      saveFriendlyState();

    }

    if(
      typeof originalRenderFriendlyScore==='function'
    ){

      originalRenderFriendlyScore();

    }

    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          50
        );

      }
    );

    syncScorerDisplay();

    renderAgreement();

  }else{

    if(
      typeof originalRenderFriendlyScore==='function'
    ){

      originalRenderFriendlyScore();

    }

    syncScorerDisplay();

    renderAgreement();

  }

  return result.data;

}


/* =========================================================
   REPLACE SAVE BUTTON FUNCTION
   ========================================================= */

window.saveFriendlyScore=
  async function(){

    const button=
      document.getElementById(
        'friendlySaveAllBtn'
      );

    if(button)
      button.disabled=true;

    try{

      await saveMultiScores();

      if(typeof toast==='function'){

        toast(
          'Scores saved'
        );

      }

    }catch(error){

      console.error(
        'Multi-scorer save failed:',
        error
      );

      if(typeof toast==='function'){

        toast(
          error.message ||
          'Could not save scores'
        );

      }

    }finally{

      if(button)
        button.disabled=false;

      if(
        typeof updateFriendlySaveButton===
        'function'
      ){

        updateFriendlySaveButton();

      }

    }

  };


/* =========================================================
   FINALISE
   ========================================================= */

window.nlgsFinaliseFriendlyRound=
  async function(){

    if(finalising)
      return;

    const game=getRound();

    if(
      !game ||
      !game.dbId
    ){

      return;

    }

    finalising=true;

    const button=
      document.getElementById(
        'friendlyFinaliseBtn'
      );

    if(button){

      button.disabled=true;

      button.textContent=
        'CHECKING SCORES…';

    }

    try{

      await refreshStatus();

      let missing=0;
      let conflicts=0;

      for(
        let hole=1;
        hole<=18;
        hole++
      ){

        const result=
          checkHole(
            game,
            hole
          );

        missing+=
          result.missing.length;

        conflicts+=
          result.conflicts.length;

      }

      if(
        missing ||
        conflicts
      ){

        if(typeof toast==='function'){

          toast(
            'Round cannot be finalised. '+
            'Resolve missing scores and discrepancies first.'
          );

        }

        renderAgreement();

        return;

      }


      /*
        Build final agreed scorecard.
      */

      for(
        let playerIndex=0;
        playerIndex<game.players.length;
        playerIndex++
      ){

        const player=
          game.players[playerIndex];

        game.scores[player]={};

        for(
          let hole=1;
          hole<=18;
          hole++
        ){

          const rows=
            allSubmissions(
              playerIndex,
              hole
            );

          const values=[
            ...new Set(
              rows.map(function(row){

                return Number(
                  row.strokes
                );

              })
            )
          ];

          if(values.length!==1){

            throw new Error(
              'A final agreed score could not be established.'
            );

          }

          game.scores[player][hole]=
            values[0];

        }

      }

      if(
        typeof saveFriendlyState==='function'
      ){

        saveFriendlyState();

      }

      if(
        typeof saveFriendlyToDatabase==='function'
      ){

        try{

          await saveFriendlyToDatabase();

        }catch(error){

          console.warn(
            'Final database save:',
            error
          );

        }

      }

      if(
        typeof finishFriendlyRound==='function'
      ){

        finishFriendlyRound();

      }

    }catch(error){

      console.error(
        'Finalisation failed:',
        error
      );

      if(typeof toast==='function'){

        toast(
          error.message ||
          'Could not finalise the round'
        );

      }

    }finally{

      finalising=false;

      if(button){

        button.disabled=false;

        button.textContent=
          'FINALISE ROUND';

      }

    }

  };


/* =========================================================
   OVERRIDE RENDER
   ========================================================= */

const originalRenderFriendlyScore=
  window.renderFriendlyScore;

window.renderFriendlyScore=
  function(){

    if(
      typeof originalRenderFriendlyScore===
      'function'
    ){

      originalRenderFriendlyScore();

    }

    ensureAgreementPanel();

    /*
      The original app may have displayed the
      old shared scorecard. Immediately replace
      that display with THIS MEMBER'S status.
    */

    setTimeout(
      function(){

        syncScorerDisplay();

        renderAgreement();

      },
      20
    );

  };


/* =========================================================
   INITIALISE
   ========================================================= */

setTimeout(
  async function(){

    try{

      ensureAgreementPanel();

      await refreshStatus();

      syncScorerDisplay();

      renderAgreement();

    }catch(error){

      console.warn(

      );

    }

  },
  1000
);


/* =========================================================
   ALSO WATCH FOR LOGIN / SCREEN CHANGES

setInterval(

    try{

      const game=getRound();

      if(
        game &&
        game.dbId
      ){

        ensureAgreementPanel();

        syncScorerDisplay();

      }

    }catch(e){}

  },
  1000
);
