<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLGS Manage Players TEST</title><style>
body{margin:0;background:#e9ece5;font-family:system-ui;color:#193127}.app{max-width:480px;margin:auto;min-height:100vh;background:#f6f3e8}.top{background:#064b35;color:white;padding:16px 18px}.brand{font:22px Georgia}.sub{font-size:9px;letter-spacing:1.5px}.main{padding:18px 16px}.hero{background:linear-gradient(160deg,#064b35,#0b7452);color:white;border-radius:20px;padding:22px 18px}.hero h1{font:29px Georgia;margin:5px 0}.card,.player{background:white;border-radius:15px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:12px;color:#6b756f}.btn{border:0;border-radius:10px;padding:11px 13px;background:#064b35;color:white;font-weight:700}.secondary{background:#edf0e9;color:#064b35}.search,input{padding:11px;border:1px solid #d8ddd5;border-radius:9px;font-size:16px}.search{width:100%;margin-top:10px;box-sizing:border-box}.hcp{font-size:21px;font-weight:800;color:#064b35}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1}.edit{margin-top:10px}.notice{background:#edf4ef;padding:11px;border-radius:10px;font-size:12px}
</style></head><body><div class="app"><header class="top"><div class="brand">NLGS</div><div class="sub">NORWICH LOCO GOLF SOCIETY</div></header><main class="main"><div class="hero"><div class="small" style="color:white">ADMIN TEST VERSION</div><h1>Manage Players & Handicaps</h1><div>Safe test — no database changes.</div></div><div class="notice">Everything on this page is temporary. Nothing is saved to Supabase.</div><div class="card"><div class="row"><div><b>Players</b><div class="small" id="count"></div></div><button class="btn" onclick="add()">+ Add Player</button></div><input id="search" class="search" placeholder="Search players..." oninput="render()"><div id="list"></div></div></main></div>
<script>
const starter=[['Gary G',18.4,true],['Test Player 1',12.6,true],['Test Player 2',24.1,true],['Test Player 3',8.7,true],['Test Player 4',31.2,false]];
let p=JSON.parse(localStorage.getItem('nlgsTestPlayers')||'null')||starter;
function persist(){localStorage.setItem('nlgsTestPlayers',JSON.stringify(p))}
function render(){let q=document.getElementById('search').value.toLowerCase(),a=p.filter(x=>x[0].toLowerCase().includes(q));document.getElementById('count').textContent=p.filter(x=>x[2]).length+' active players';document.getElementById('list').innerHTML=a.map(x=>{let i=p.indexOf(x);return '<div class="player"><div class="row"><div><b>'+x[0]+'</b><div class="small">'+(x[2]?'Active':'Inactive')+'</div></div><div><div class="small">Handicap</div><div class="hcp">'+x[1].toFixed(1)+'</div></div></div><div class="actions"><button class="btn secondary" onclick="edit('+i+')">Edit Handicap</button><button class="btn secondary" onclick="toggle('+i+')">'+(x[2]?'Deactivate':'Activate')+'</button></div><div id="e'+i+'" class="edit" style="display:none"><input id="h'+i+'" type="number" step=".1" min="0" max="54" value="'+x[1]+'"><button class="btn" onclick="save('+i+')">Save</button></div></div>'}).join('')}
function edit(i){document.getElementById('e'+i).style.display='block'}
function save(i){let h=parseFloat(document.getElementById('h'+i).value);if(isNaN(h)||h<0||h>54){alert('Enter a handicap from 0.0 to 54.0');return}p[i][1]=h;persist();render()}
function toggle(i){p[i][2]=!p[i][2];persist();render()}
function add(){let n=prompt('Player name');if(!n)return;n=n.trim();if(!n)return;if(p.some(x=>x[0].toLowerCase()===n.toLowerCase())){alert('That player already exists.');return}let h=parseFloat(prompt('Handicap','20.0'));if(isNaN(h)||h<0||h>54){alert('Enter a handicap from 0.0 to 54.0');return}p.push([n,h,true]);persist();render()}
render();
</script></body></html>
