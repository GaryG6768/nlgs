<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064b35">
<title>NLGS — Norwich Loco Golf Society</title>
<style>
:root{--g:#064b35;--g2:#0b7452;--gold:#c9a44a;--cream:#f6f3e8;--ink:#193127;--muted:#6b756f;--line:#e2e6df}
*{box-sizing:border-box}body{margin:0;background:#e9ece5;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{max-width:480px;min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 30px #0002}
.login{min-height:100vh;display:flex;align-items:center;padding:24px 18px;background:linear-gradient(160deg,var(--g),#063b2b)}
.panel{width:100%;background:var(--cream);border-radius:26px;padding:28px 22px;box-shadow:0 18px 45px #0004}
.logo{width:82px;height:82px;margin:0 auto 14px;display:block}.logo svg{width:100%;height:100%;display:block}
h1{font:34px Georgia,serif;text-align:center;margin:0;color:var(--g)}.sub{text-align:center;font-size:11px;letter-spacing:1.7px;color:var(--muted);margin:5px 0 26px}
.goldline{height:3px;width:55px;background:var(--gold);margin:0 auto 24px}
label{display:block;font-size:12px;font-weight:750;margin:15px 0 7px}input{width:100%;padding:15px;border:1px solid #d4dad2;border-radius:12px;background:#fff;font-size:17px;outline:none}input:focus{border-color:var(--g2)}
.pin{letter-spacing:8px;text-align:center;font-size:22px}button{width:100%;border:0;border-radius:12px;padding:15px;background:var(--g);color:#fff;font-weight:800;font-size:15px;margin-top:18px}button:disabled{opacity:.55}
.msg{min-height:20px;text-align:center;font-size:13px;margin-top:13px;color:#a33}
.appview{display:none;min-height:100vh}.top{background:var(--g);color:white;padding:15px 18px;text-align:center}.brand{font:22px Georgia,serif;letter-spacing:1px}.tiny{font-size:9px;letter-spacing:1.4px;opacity:.85}
main{padding:18px 16px 90px}.hero{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:15px}.hero h2{font:32px Georgia,serif;margin:3px 0}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #19312710}.label{font-size:11px;color:var(--muted);letter-spacing:.5px}.big{font-size:20px;font-weight:800}.pill{display:inline-block;background:#e8f2ed;color:var(--g);padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border-radius:15px;padding:16px;border:0;color:var(--ink);text-align:left;margin:0;box-shadow:0 3px 14px #19312710}.tile span{font-size:22px}.tile b{display:block;margin-top:7px}.tile small{color:var(--muted)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;color:#66716a;border-radius:0;margin:0;padding:9px 2px;font-size:11px}.nav button.active{color:var(--g);font-weight:900}.nav span{display:block;font-size:19px}
</style>
</head>
<body>
<div class="app">
<section id="login" class="login">
<div class="panel">
<div class="logo" aria-label="NLGS"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="90" fill="#064b35"/><circle cx="256" cy="170" r="82" fill="#f6f3e8"/><path d="M256 90v165M181 350c45-45 105-45 150 0" fill="none" stroke="#c9a44a" stroke-width="18" stroke-linecap="round"/><text x="256" y="438" text-anchor="middle" font-family="Georgia,serif" font-size="76" font-weight="700" fill="#fff">NLGS</text></svg></div>
<h1>NLGS</h1><div class="sub">NORWICH LOCO GOLF SOCIETY</div><div class="goldline"></div>
<label for="name">MEMBER NAME</label>
<input id="name" autocomplete="name" placeholder="Enter your name">
<label for="pin">4-DIGIT PIN</label>
<input id="pin" class="pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••">
<button id="loginBtn" onclick="login()">LOGIN</button>
<div id="msg" class="msg"></div>
</div></section>

<section id="appview" class="appview">
<header class="top"><div class="brand">NLGS</div><div class="tiny">NORWICH LOCO GOLF SOCIETY</div></header>
<main>
<div class="hero"><div class="tiny">WELCOME</div><h2 id="welcome">Member</h2><p style="margin:4px 0 0;opacity:.9">Ready to play?</p></div>
<div class="card"><div class="label">YOUR HANDICAP</div><div class="big" id="hcp">—</div><div style="margin-top:8px"><span class="pill">100% HDC</span> <span class="pill">85% HDC</span> <span class="pill">75% HDC</span></div></div>
<div class="grid">
<button class="tile" onclick="notice('Competition screen coming next')"><span>🏆</span><b>Competitions</b><small>Play & results</small></button>
<button class="tile" onclick="notice('Scorecard screen coming next')"><span>🏌️</span><b>Scorecard</b><small>Enter your round</small></button>
<button class="tile" onclick="notice('Leaderboard screen coming next')"><span>📊</span><b>Leaderboard</b><small>Live positions</small></button>
<button class="tile" onclick="notice('Fixtures screen coming next')"><span>📅</span><b>Fixtures</b><small>Upcoming golf</small></button>
</div>
<div class="card" id="adminCard" style="display:none"><b>⚙️ NLGS Administration</b><p style="margin:7px 0;color:var(--muted)">Full administrator controls will appear here.</p></div>
</main>
<nav class="nav"><button class="active"><span>⌂</span>Home</button><button onclick="notice('Scorecard next')"><span>🏌</span>Score</button><button onclick="notice('Results next')"><span>🏆</span>Results</button><button onclick="logout()"><span>↪</span>Logout</button></nav>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://ifjsjksskaknuqjboxsl.supabase.co","sb_publishable_sM00u7HKZ06m9XFFG2pBug_ypzkbnZp");
async function login(){
 const name=document.getElementById('name').value.trim(), pin=document.getElementById('pin').value.trim();
 const msg=document.getElementById('msg'), btn=document.getElementById('loginBtn');
 msg.textContent='';
 if(!name||!/^[0-9]{4}$/.test(pin)){msg.textContent='Enter your name and 4-digit PIN.';return}
 btn.disabled=true;btn.textContent='LOGGING IN…';
 const {data,error}=await sb.rpc('login_member',{p_full_name:name,p_pin:pin});
 if(error||!data||data.length===0){msg.textContent='Name or PIN not recognised.';btn.disabled=false;btn.textContent='LOGIN';return}
 const m=data[0];sessionStorage.setItem('nlgsMember',JSON.stringify(m));
 showMember(m); btn.disabled=false;btn.textContent='LOGIN';
}
function showMember(m){document.getElementById('login').style.display='none';document.getElementById('appview').style.display='block';document.getElementById('welcome').textContent=m.full_name;document.getElementById('hcp').textContent=m.handicap;document.getElementById('adminCard').style.display=m.role==='admin'?'block':'none'}
function logout(){sessionStorage.removeItem('nlgsMember');document.getElementById('appview').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('pin').value='';document.getElementById('msg').textContent=''}
function notice(t){alert(t)}
const saved=sessionStorage.getItem('nlgsMember'); if(saved){try{showMember(JSON.parse(saved))}catch(e){logout()}}
</script>
</body></html>
